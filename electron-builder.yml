# Configuración de electron-builder: instalador NSIS para Windows.
appId: ar.com.dmartinezseguros.gestion
productName: DM Gestión
copyright: Copyright © 2026 Seguros Daniel Martínez
artifactName: DM-Gestion-Setup-${version}.${ext}

directories:
  output: release
  buildResources: recursos

# Esta sección sólo le dice a electron-builder QUÉ FORMA tienen los archivos de actualización
# (latest.yml) que genera junto al instalador; no publica nada. La build siempre corre con
# "--publish never" (ver scripts/publicar.mjs) y la publicación a GitHub Releases la hace ese
# script aparte, con "gh release create": en pruebas, "electron-builder --publish" creaba dos
# Releases para el mismo tag en una carrera interna y repartía los archivos entre las dos copias
# al azar (a veces "latest.yml" quedaba en la copia sin el instalador).
publish:
  provider: github
  owner: zeroframe404
  repo: dm-gestion
  private: true

files:
  - dist/**/*
  - package.json

# Los binarios nativos (better-sqlite3) no pueden cargarse desde dentro del asar.
asarUnpack:
  - "**/*.node"

# better-sqlite3 13 trae binarios N-API precompilados (prebuilds/), válidos para Electron: no hace falta recompilar.
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DM Gestión
  installerLanguages:
    - es_ES
  language: "3082"
