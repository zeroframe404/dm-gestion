# Arma el instalador de Windows y lo publica como GitHub Release, sin depender de ninguna PC.
#
# Cómo se usa: se empuja un tag `vX.Y.Z` que apunte a un commit cuyo package.json tenga esa misma
# versión, y este workflow hace el resto. La versión del tag y la del package.json TIENEN que coincidir:
# el instalador se llama `DM-Gestion-Setup-<version del package.json>.exe` y `scripts/publicar.mjs`
# busca exactamente ese archivo, así que si no coinciden el paso de publicar falla y no sube nada a medias.
#
#   git tag v1.0.4 && git push origin v1.0.4
#
# Lo normal es correrlo a mano desde la pestaña Actions (Run workflow) dejando `subir_version` en
# «automatica»: si la versión del package.json ya tiene Release, sube un parche; si todavía no salió,
# publica esa. `minor`/`major` suben más; `republicar-la-misma` vuelve a subir los archivos de una
# versión ya publicada (no actualiza ninguna computadora: es sólo para reparar un Release).
name: Publicar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      subir_version:
        description: 'Versión a publicar. «automatica»: si la versión del package.json ya está publicada sube un parche; si no, publica esa.'
        type: choice
        options:
          - automatica
          - patch
          - minor
          - major
          - republicar-la-misma
        default: automatica

# `scripts/publicar.mjs` crea el Release con `gh`: necesita permiso de escritura sobre el contenido.
permissions:
  contents: write

# Dos publicaciones a la vez del mismo tag se pisarían los archivos del Release.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    # Tiene que ser Windows: el instalador es NSIS y el binario nativo de better-sqlite3 es el de Windows.
    runs-on: windows-latest

    steps:
      - name: Traer el código
        uses: actions/checkout@v4
        with:
          # Con el historial y los tags completos, `scripts/publicar.mjs` encuentra el tag ya existente
          # en vez de intentar crearlo de nuevo.
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Al lanzar a mano, decide qué versión sale. Antes, dejar el campo en blanco volvía a subir la
      # MISMA versión que ya estaba publicada (pasó tres veces seguidas con la 18.0.0): el Release se
      # pisaba y ninguna computadora veía nada nuevo, porque para el actualizador era la misma versión.
      # Ahora «automatica» sube un parche si esa versión ya tiene Release, y sólo publica la del
      # package.json tal cual si todavía no salió (por ejemplo, después de una publicación caída).
      #
      # La subida se hace acá SIN empujar: el commit y el tag se empujan recién en «Empujar la versión»,
      # con las pruebas pasadas y el instalador armado. Antes `npm version` empujaba de entrada y, si
      # las pruebas fallaban, quedaba el número quemado en master sin Release (la 18.1.0).
      #
      # `ajustar-cambios.mjs` renombra la entrada pendiente de «Cambios recientes» (en beta se escribe
      # en el próximo parche) a la versión que sale de verdad, así `minor` y `major` no rompen el cartel.
      - name: Subir la versión
        id: version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tipo="${{ inputs.subir_version }}"
          actual="$(node -p "require('./package.json').version")"
          if [ "$tipo" = "automatica" ] || [ -z "$tipo" ]; then
            if gh release view "v$actual" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              tipo=patch
              echo "La $actual ya está publicada: sale un parche."
            else
              tipo=republicar-la-misma
              echo "La $actual todavía no tiene Release: se publica esa."
            fi
          fi
          if [ "$tipo" = "republicar-la-misma" ]; then
            echo "Publicando $actual sin subir la versión."
            exit 0
          fi
          node scripts/verificar-al-dia.mjs
          npm version "$tipo" --no-git-tag-version --ignore-scripts
          node scripts/ajustar-cambios.mjs "$actual"
          nueva="$(node -p "require('./package.json').version")"
          git add package.json package-lock.json src/shared/cambios.ts
          git commit -m "$nueva"
          git tag -a "v$nueva" -m "$nueva"
          echo "nueva=$nueva" >> "$GITHUB_OUTPUT"
          echo "### Sale la $nueva (antes $actual)" >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que el tag y el package.json digan la misma versión
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/', '' } else { "v$version" }
          if ($tag -ne "v$version") {
            Write-Error "El tag es $tag pero el package.json dice $version. Subí la versión en el commit que apunta el tag."
            exit 1
          }
          Write-Host "Publicando $tag"

      # El token del puente con el servidor no está en el código: es un secreto del repositorio (ver
      # scripts/secretos-de-fabrica.mjs). Se comprueba ACÁ, antes de los cinco minutos de pruebas, y no al
      # final: sin él no hay nada que publicar.
      - name: Comprobar los secretos de fábrica
        run: node scripts/verificar-fabrica.mjs --antes
        env:
          DMG_FABRICA_VPS_TOKEN: ${{ secrets.DMG_VPS_TOKEN }}

      # El banco de pruebas antes que nada: una versión que se instala sola en las PCs de la agencia no
      # puede salir sin pasar por acá. `npm run dist` corre después el typecheck y la compilación.
      - name: Correr el banco de pruebas
        run: npm run prueba

      - name: Armar el instalador
        run: npm run dist
        env:
          DMG_FABRICA_VPS_TOKEN: ${{ secrets.DMG_VPS_TOKEN }}

      # Antes de empujar la versión: que el programa compilado lleve el token. Si no lo lleva, la versión
      # no se quema.
      - name: Comprobar que el instalador lleva los secretos de fábrica
        run: node scripts/verificar-fabrica.mjs
        env:
          DMG_FABRICA_VPS_TOKEN: ${{ secrets.DMG_VPS_TOKEN }}

      # Recién acá, con las pruebas pasadas y el instalador armado, la versión nueva llega a master.
      - name: Empujar la versión
        if: steps.version.outputs.nueva != ''
        shell: bash
        run: |
          git push origin HEAD:master
          git push origin "v${{ steps.version.outputs.nueva }}"

      - name: Publicar el Release
        run: node scripts/publicar.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG_FABRICA_VPS_TOKEN: ${{ secrets.DMG_VPS_TOKEN }}

      # Una copia de más, para poder bajar el instalador desde la corrida aunque el Release se haya
      # borrado. Es SECUNDARIA: lo que actualiza las computadoras de la agencia es el Release, que a
      # esta altura ya está publicado.
      #
      # Por eso `continue-on-error`. El 6 de septiembre de 2026 una publicación quedó marcada en rojo
      # con el instalador ya subido al Release y andando: lo que falló fue esta copia, porque la cuota
      # de artefactos de la cuenta estaba llena («Artifact storage quota has been hit»). Una corrida en
      # rojo después de una publicación que salió bien hace perder media hora averiguando qué se rompió,
      # y peor: invita a volver a publicar algo que ya estaba publicado. Si esta copia no se puede
      # guardar, queda el aviso en la corrida y la publicación sigue siendo un éxito, que es lo que es.
      #
      # Y `retention-days: 7` para que la cuota no se vuelva a llenar sola: el instalador pesa unos
      # 130 MB y el valor por defecto los guarda 90 días, así que con cada publicación se acumulaban
      # más de tres meses de instaladores que nadie mira. Una semana alcanza de sobra para el único
      # caso en que esto sirve —bajarlo a mano poco después de publicar—, y el Release, que es la copia
      # que importa, no vence nunca.
      - name: Guardar el instalador como artefacto
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: instalador
          path: |
            release/DM-Gestion-Setup-*.exe
            release/DM-Gestion-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7
