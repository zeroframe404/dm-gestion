# Arma el instalador de Windows y lo publica como GitHub Release, sin depender de ninguna PC.
#
# Cómo se usa: se empuja un tag `vX.Y.Z` que apunte a un commit cuyo package.json tenga esa misma
# versión, y este workflow hace el resto. La versión del tag y la del package.json TIENEN que coincidir:
# el instalador se llama `DM-Gestion-Setup-<version del package.json>.exe` y `scripts/publicar.mjs`
# busca exactamente ese archivo, así que si no coinciden el paso de publicar falla y no sube nada a medias.
#
#   git tag v1.0.4 && git push origin v1.0.4
#
# También se puede correr a mano desde la pestaña Actions (Run workflow), eligiendo el tag. Y si lo que
# hace falta es subir la versión (no sólo repetir la que ya está en el package.json), el input
# `subir_version` hace ese paso también acá: elegí `patch`/`minor`/`major`, y el workflow sube la
# versión, la commitea, crea el tag y sigue con el instalador y el Release — sin tocar ninguna PC.
name: Publicar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      subir_version:
        description: 'Subir la versión antes de publicar (dejar en blanco para publicar la que ya está en el package.json)'
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
        default: ''

# `scripts/publicar.mjs` crea el Release con `gh`: necesita permiso de escritura sobre el contenido.
permissions:
  contents: write

# Dos publicaciones a la vez del mismo tag se pisarían los archivos del Release.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    # Tiene que ser Windows: el instalador es NSIS y el binario nativo de better-sqlite3 es el de Windows.
    runs-on: windows-latest

    steps:
      - name: Traer el código
        uses: actions/checkout@v4
        with:
          # Con el historial y los tags completos, `scripts/publicar.mjs` encuentra el tag ya existente
          # en vez de intentar crearlo de nuevo.
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Sólo corre al lanzar a mano con un tipo de versión elegido. `npm version` corre el
      # preversion/postversion de package.json: verifica que esta copia esté al día con `master` y,
      # si lo está, sube el número de versión, commitea y empuja el commit y el tag a `master` (el
      # push va a `master` explícito porque el checkout de este workflow queda en HEAD despegado).
      - name: Subir la versión
        if: github.event_name == 'workflow_dispatch' && inputs.subir_version != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.subir_version }}"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que el tag y el package.json digan la misma versión
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/', '' } else { "v$version" }
          if ($tag -ne "v$version") {
            Write-Error "El tag es $tag pero el package.json dice $version. Subí la versión en el commit que apunta el tag."
            exit 1
          }
          Write-Host "Publicando $tag"

      # El banco de pruebas antes que nada: una versión que se instala sola en las PCs de la agencia no
      # puede salir sin pasar por acá. `npm run dist` corre después el typecheck y la compilación.
      - name: Correr el banco de pruebas
        run: npm run prueba

      - name: Armar el instalador
        run: npm run dist

      - name: Publicar el Release
        run: node scripts/publicar.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Una copia de más, para poder bajar el instalador desde la corrida aunque el Release se haya
      # borrado. Es SECUNDARIA: lo que actualiza las computadoras de la agencia es el Release, que a
      # esta altura ya está publicado.
      #
      # Por eso `continue-on-error`. El 6 de septiembre de 2026 una publicación quedó marcada en rojo
      # con el instalador ya subido al Release y andando: lo que falló fue esta copia, porque la cuota
      # de artefactos de la cuenta estaba llena («Artifact storage quota has been hit»). Una corrida en
      # rojo después de una publicación que salió bien hace perder media hora averiguando qué se rompió,
      # y peor: invita a volver a publicar algo que ya estaba publicado. Si esta copia no se puede
      # guardar, queda el aviso en la corrida y la publicación sigue siendo un éxito, que es lo que es.
      #
      # Y `retention-days: 7` para que la cuota no se vuelva a llenar sola: el instalador pesa unos
      # 130 MB y el valor por defecto los guarda 90 días, así que con cada publicación se acumulaban
      # más de tres meses de instaladores que nadie mira. Una semana alcanza de sobra para el único
      # caso en que esto sirve —bajarlo a mano poco después de publicar—, y el Release, que es la copia
      # que importa, no vence nunca.
      - name: Guardar el instalador como artefacto
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: instalador
          path: |
            release/DM-Gestion-Setup-*.exe
            release/DM-Gestion-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7
